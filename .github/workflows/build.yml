name: Build PS3 Slither

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3dev:latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: ✅ Verificar ambiente
        run: |
          echo "PS3DEV=$PS3DEV"
          ppu-gcc --version

      - name: 🏗️ Compilar jogo
        run: |
          make clean
          make

      - name: 📦 Preparar arquivos do PKG
        run: |
          mkdir -p pkg_build/USRDIR pkg_build/TROPDIR
          cp EBOOT.BIN pkg_build/USRDIR/EBOOT.BIN
          
          # Baixa ícone
          wget -q -O pkg_build/ICON0.PNG https://via.placeholder.com/512/101826/FFFFFF?text=PS3+Slither

      - name: 📝 Criar PARAM.SFO
        run: |
          python3 << 'PYEOF'
import struct, os

def make_sfo(path, data):
    keys, vals = list(data.keys()), list(data.values())
    kbuf, vbuf, ents = b'', b'', []
    for k, v in zip(keys, vals):
        kbuf += k.encode() + b'\x00'
        if isinstance(v, str):
            vb = v.encode() + b'\x00'
            fmt = 4
        else:
            vb = str(v).encode() + b'\x00'
            fmt = 4
        ents.append(struct.pack('<HHHI', len(kbuf)-len(k)-1, fmt, len(vb), len(vbuf)))
        vbuf += vb
    hdr = struct.pack('<4sIIII', b'\x00PSF', 0x100, len(ents), len(kbuf), len(vbuf))
    hdr += b'\x00' * (0x40 - len(hdr))
    with open(path, 'wb') as f:
        f.write(hdr)
        for e in ents: f.write(e)
        f.write(kbuf)
        f.write(vbuf)

    print("✅ PARAM.SFO criado!")

sfo = {
    "TITLE": "PS3 Slither",
    "TITLE_ID": "PS3SLITHE",
    "VERSION": "01.00",
    "APP_VER": "01.00",
    "CATEGORY": "HG"
}
make_sfo("pkg_build/PARAM.SFO", sfo)
PYEOF

      - name: 📦 Gerar PKG
        run: |
          cd pkg_build
          cat > package.conf << 'EOF'
CONTENT_ID = UP0001-PS3SLITHE_00-0000000000000000
TITLE = PS3 Slither
TITLE_ID = PS3SLITHE
VERSION = 01.00
CATEGORY = HG
PKGVERSION = 01.00
EOF
          
          psn_package_npdrm package.conf .
          package_finalize UP0001-PS3SLITHE_00-0000000000000000.pkg
          mv UP0001-PS3SLITHE_00-0000000000000000.pkg ../PS3-Slither.pkg
          cd ..
          echo "✅ PKG gerado com sucesso!"

      - name: 📤 Baixar PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Slither-PKG
          path: PS3-Slither.pkg
          retention-days: 30
