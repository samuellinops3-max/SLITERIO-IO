name: Build PS3 Slither

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CONTENT_ID: UP0001-PS3SLITHE_00-0000000000000000
  TITLE: PS3 Slither
  TITLE_ID: PS3SLITHE
  VERSION: 01.00

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🔧 Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget xz-utils make gcc flex bison \
            libelf-dev libgmp3-dev libmpfr-dev libmpc-dev zlib1g-dev

      - name: 🛠️ Instalar PS3 Toolchain
        run: |
          wget -q https://github.com/ps3dev/ps3dev-docker/releases/download/toolchain-20220523/ps3dev.tar.xz
          mkdir -p ~/ps3dev
          tar xf ps3dev.tar.xz -C ~/ps3dev
          echo "PS3DEV=$HOME/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$HOME/ps3dev" >> $GITHUB_ENV
          echo "$HOME/ps3dev/bin:$HOME/ps3dev/ppu/bin:$HOME/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: 🎨 Criar arquivos de mídia
        run: |
          mkdir -p assets
          # Gera PARAM.SFO automaticamente
          sfo --title="${{ env.TITLE }}" --titleid="${{ env.TITLE_ID }}" \
              --version="${{ env.VERSION }}" --app_ver="${{ env.VERSION }}" \
              --category=HG assets/PARAM.SFO
          # Baixa ícone padrão
          wget -q -O assets/ICON0.PNG https://via.placeholder.com/512/101826/FFFFFF?text=PS3+Slither

      - name: 🏗️ Compilar e gerar PKG
        run: |
          export PS3DEV=$HOME/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make clean
          make pkg

      - name: 📤 Baixar PKG pronto
        uses: actions/upload-artifact@v4
        with:
          name: PS3-Slither-PKG
          path: 'PS3-Slither.pkg'
          retention-days: 30
